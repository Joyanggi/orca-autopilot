name: {{PROJECT_NAME}} CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: {{PROJECT_KEY}}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 이 이름이 main 룰셋의 필수 검사입니다. 바꾸면 `oap github`도 다시 실행하세요.
    name: {{CI_NAME}}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 커밋·PR 제목 검사
        if: github.event_name == 'pull_request'
        run: python3 -B .github/scripts/check_git_titles.py "$GITHUB_EVENT_PATH"
      - name: diff와 설정 파일 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then git diff --check "$BASE_SHA" HEAD; fi
          python3 -m json.tool .claude/settings.json >/dev/null
          python3 -m json.tool orca-autopilot.json >/dev/null
          if git cat-file -e "$BASE_SHA:package.json" 2>/dev/null && [ ! -f package.json ]; then
            echo '앱 매니페스트(package.json)가 삭제됐습니다. 앱 검사를 건너뛰지 않습니다.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: '24'
          cache: npm
      - name: 앱 검사
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present -- --ci
